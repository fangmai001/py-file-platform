server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # The per-file upload limit is admin-editable at runtime, so nginx can't track it.
        # This is the fixed ceiling instead, matching MAX_UPLOAD_SIZE_MB_CEILING in
        # backend/app/core/upload_limit.py - change both together, or the backend limit
        # above this value would be unreachable (nginx would 413 first).
        client_max_body_size 512m;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # react-router-dom client-side routing: any non-API path that isn't a real static
    # file falls back to index.html so deep links (e.g. /admin) don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
