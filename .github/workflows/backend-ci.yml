name: Backend CI

# No `paths:` filter on purpose: a workflow skipped by path filtering never reports a
# status, so a required status check would sit in "Expected" forever and block the PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://platform:platform@localhost:5432/platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run migrations against Postgres
        working-directory: backend
        run: alembic upgrade head

      # 測試是用 Base.metadata.create_all 建 schema 的（tests/conftest.py），從來不跑
      # migration，所以「model 與 migration 已經分岔」這件事在 pytest 裡完全看不見——
      # 兩邊各自對著不同的 schema 一起變綠。這一步拿 migrate 出來的資料庫比對 model，
      # 只要有差異就失敗。
      - name: Check models against migrations
        working-directory: backend
        run: alembic check

      - name: Run tests
        working-directory: backend
        run: pytest
