services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single image built from the repo-root Dockerfile: the frontend is built into it and
  # served by FastAPI itself, so the SPA and the API share one origin and one port.
  # Together with db that makes exactly two images to ship for an offline install.
  #
  # image: is set explicitly so the name does not depend on the deployment directory
  # name - without it compose derives "<project>-app" and an offline host deployed
  # under any other directory would fail to find the loaded image and try to build.
  # APP_VERSION also ties the tag to the tar filenames scripts/package-images.sh emits,
  # and is baked into the image so GET /health can report the running version. It has no
  # fallback on purpose: "latest" made every release share one tag, so the offline host
  # had nothing to roll back to. Failing here with a clear message beats resolving to a
  # tag that was never delivered and watching compose try to build without a network.
  app:
    image: py-file-platform-app:${APP_VERSION:?APP_VERSION must be set in .env (e.g. v0.1.0)}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@db:5432/${POSTGRES_DB:-platform}
    ports:
      - "80:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
